name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Linux: gcc + clang, all four backends, Release; one Debug canary per compiler.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.backend }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
        build_type: [Release]
        include:
          - compiler: gcc
            backend: LOGURU
            build_type: Debug
          - compiler: clang
            backend: LOGURU
            build_type: Debug
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Select compiler
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=${{ matrix.build_type }}
          --backend=${{ matrix.backend }}
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build

  # ---------------------------------------------------------------------------
  # macOS: AppleClang, all four backends, Release.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS / ${{ matrix.backend }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --backend=${{ matrix.backend }}
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build

  # ---------------------------------------------------------------------------
  # Windows: MSVC, all four backends, Release.
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / ${{ matrix.backend }}
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [LOGURU, SPDLOG, GLOG, NATIVE]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --backend=${{ matrix.backend }}
          --benchmark=ON

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build --build-type Release

  # ---------------------------------------------------------------------------
  # Compiler cache & Icecc: exercise LOGGING_ENABLE_CACHE/LOGGING_CACHE_BACKEND
  # (ccache, sccache, buildcache) and LOGGING_ENABLE_ICECC across
  # Linux/macOS/Windows.  Icecc has no Windows port, so it is exercised on
  # Linux/macOS only.
  # ---------------------------------------------------------------------------
  cache-icecc:
    name: Cache & Icecc / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-ccache
            os: ubuntu-latest
            backend: ccache
          - name: linux-sccache
            os: ubuntu-latest
            backend: sccache
          - name: linux-buildcache
            os: ubuntu-latest
            backend: buildcache
          - name: linux-icecc
            os: ubuntu-latest
            icecc: true
          - name: macos-ccache
            os: macos-latest
            backend: ccache
          - name: macos-sccache
            os: macos-latest
            backend: sccache
          - name: macos-buildcache
            os: macos-latest
            backend: buildcache
          - name: macos-icecc
            os: macos-latest
            icecc: true
          - name: windows-ccache
            os: windows-latest
            backend: ccache
          - name: windows-sccache
            os: windows-latest
            backend: sccache
          - name: windows-buildcache
            os: windows-latest
            backend: buildcache
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Install Ninja + cache/icecc tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache icecc

      - name: Install Ninja + cache/icecc tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja ccache icecream

      - name: Install ccache (Windows)
        if: runner.os == 'Windows' && matrix.backend == 'ccache'
        run: choco install -y ccache

      - uses: mozilla-actions/sccache-action@v0.0.9
        if: matrix.backend == 'sccache'
        with:
          version: v0.12.0

      - name: Set BuildCache directory
        if: matrix.backend == 'buildcache'
        shell: bash
        run: echo "BUILDCACHE_DIR=$RUNNER_TEMP/buildcache-data" >> "$GITHUB_ENV"

      - name: Install BuildCache
        if: matrix.backend == 'buildcache'
        shell: bash
        run: python3 .github/scripts/install_buildcache.py --install-prefix "$RUNNER_TEMP/buildcache-tool"

      - name: Configure
        shell: bash
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Release
          --backend=NATIVE
          --benchmark=OFF
          ${{ matrix.backend && format('--cache=ON --cache-backend={0}', matrix.backend) || '' }}
          ${{ matrix.icecc && '--icecc=ON' || '' }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build

  # ---------------------------------------------------------------------------
  # Bazel: builds/tests the whole tree (default LOGURU backend), cross-platform.
  # ---------------------------------------------------------------------------
  bazel:
    name: Bazel / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: bazelbuild/setup-bazelisk@v3

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.cache/bazel
          key: bazel-${{ runner.os }}-${{ hashFiles('MODULE.bazel', 'MODULE.bazel.lock', 'BUILD.bazel') }}
          restore-keys: |
            bazel-${{ runner.os }}-

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" build --compiler=default --compilation-mode=fastbuild --target=//...

      - name: Test
        run: python3 "${{ github.workspace }}/Scripts/setup_bazel.py" test --compiler=default --compilation-mode=fastbuild --target=//... --test-output=errors

  # ---------------------------------------------------------------------------
  # Sanitizers: Clang ASan and UBSan, default backend, Debug.
  # Linux + macOS only — Cmake/sanitize.cmake requires Clang/GCC and explicitly
  # warns "Sanitizers require GCC or Clang" for MSVC, so Windows is skipped
  # (unsupported by the codebase's own sanitizer module, not a CI gap).
  # ---------------------------------------------------------------------------
  sanitize:
    name: Sanitizer / ${{ matrix.os }} / ${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        sanitizer: [address, undefined]
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --backend=LOGURU
          --benchmark=OFF
          --sanitizer=ON
          --sanitizer-types=${{ matrix.sanitizer }}

      - name: Build
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Test
        env:
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/Scripts/suppressions/lsan_suppressions.txt
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build

  # ---------------------------------------------------------------------------
  # Coverage: gcc/gcov+lcov (Linux), Homebrew LLVM/clang (macOS), MSVC/OpenCppCoverage
  # (Windows). Pass --compiler explicitly: macOS's default /usr/bin/c++ is AppleClang
  # with CMAKE_CXX_COMPILER=/usr/bin/c++, and coverage-tool cannot map that path
  # (no "clang" in the filename) when CMAKE_CXX_COMPILER_ID is not a cache entry.
  # Homebrew llvm also keeps llvm-cov matched to the compiler that instrumented
  # the binaries. Codecov upload stays Linux/lcov-only.
  # ---------------------------------------------------------------------------
  coverage:
    name: Coverage / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CC: ${{ matrix.os == 'ubuntu-latest' && 'gcc' || '' }}
      CXX: ${{ matrix.os == 'ubuntu-latest' && 'g++' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ninja-build lcov

      - name: Install tools (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew install ninja llvm
          LLVM_PREFIX="$(brew --prefix llvm)"
          echo "${LLVM_PREFIX}/bin" >> "$GITHUB_PATH"
          echo "CC=${LLVM_PREFIX}/bin/clang" >> "$GITHUB_ENV"
          echo "CXX=${LLVM_PREFIX}/bin/clang++" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install -y opencppcoverage

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install coverage-tool
        run: pip install "git+https://github.com/KhwarizmiAnalytix/coverage-tool.git"

      - name: Configure (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build --generator Ninja
          --build-type=Debug
          --backend=LOGURU
          --benchmark=OFF
          --coverage=ON

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir . --build-dir build
          --backend=LOGURU
          --benchmark=OFF
          --coverage=ON

      - name: Build (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build --build-type Release

      - name: Test (Linux/macOS)
        if: matrix.os != 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build

      - name: Test (Windows)
        if: matrix.os == 'windows-latest'
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build --build-type Release

      - name: Collect coverage
        run: >
          coverage-tool --build=build
          --compiler=${{ matrix.os == 'windows-latest' && 'msvc' || (matrix.os == 'macos-latest' && 'clang' || 'gcc') }}

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html-${{ matrix.os }}
          path: build/coverage_report/html

      - name: Upload to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ---------------------------------------------------------------------------
  # Installation & find_package() test: verify that the installed package
  # works with find_package() in downstream projects (NATIVE backend).
  # Test on Linux and macOS only (representative of Unix-like systems).
  # ---------------------------------------------------------------------------
  install-and-find-package:
    name: Install & find_package / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Configure Logging
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --source-dir . --build-dir build_logging --generator Ninja
          --build-type=Release
          --backend=NATIVE
          --testing=OFF
          --benchmark=OFF
          --install-prefix=/tmp/logging_install

      - name: Build Logging
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build_logging

      - name: Install Logging
        run: python3 "${{ github.workspace }}/Scripts/setup.py" install --build-dir build_logging

      - name: Configure Example (find_package test)
        run: >
          python3 "${{ github.workspace }}/Scripts/setup.py" config --compiler=default --generator=default --source-dir Examples/FindPackageExample --build-dir build_example
          --build-type=Release
          --prefix-path=/tmp/logging_install

      - name: Build Example
        run: python3 "${{ github.workspace }}/Scripts/setup.py" build --build-dir build_example

      - name: Test Example
        run: python3 "${{ github.workspace }}/Scripts/setup.py" test --build-dir build_example

      - name: Verify Installed Headers
        run: |
          test -f /tmp/logging_install/include/logging.h || exit 1
          test -f /tmp/logging_install/include/logger/logger.h || exit 1
          test -f /tmp/logging_install/include/backend/backend.h || exit 1
          test -f /tmp/logging_install/include/backend/native_backend.h || exit 1
          test -f /tmp/logging_install/lib/cmake/Logging/LoggingConfig.cmake || exit 1
          echo "✅ All expected installation files verified"
